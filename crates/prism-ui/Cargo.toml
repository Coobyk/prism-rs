[package]
name = "prism-ui"
description = "prism-rs GUI, built with GPUI"
version.workspace = true
edition.workspace = true

[[bin]]
name = "prism-rs"
path = "src/main.rs"

[dependencies]
prism-core = { workspace = true }
gpui-kit = { version = "0.8", features = ["assets"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
